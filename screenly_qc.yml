---
syntax: manifest_v1
id: 01K6MD510DH213QWCEMXHKZ148
description: |
  Displays Power BI dashboards and reports with big focus on security.
icon: https://playground.srly.io/edge-apps/powerbi/static/img/icon.svg
author: Screenly, Inc.
categories:
  - Dashboards
ready_signal: true
settings:
  display_backtraces:
    type: string
    default_value: 'false'
    title: Display Backtraces
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: For debugging purposes to display JavaScript errors with their backtraces on the screen.
        type: boolean
      schema_version: 1
  display_errors:
    type: string
    default_value: 'true'
    title: Display Errors
    optional: true
    help_text:
      properties:
        help_text: Show an error message on the screen when the report can't be loaded or stops working. When off, the asset is skipped instead.
        type: boolean
      schema_version: 1
  embed_token:
    type: secret
    title: Embed Token
    optional: true
    help_text:
      properties:
        help_text: For testing only. In the wild, the embed token should be fetched dynamically via the API.
        type: oauth:power_bi:embed_token
      schema_version: 1
  embed_url:
    type: string
    title: Embed URL
    optional: false
    help_text:
      properties:
        help_text: The URL of the Power BI dashboard or report to display.
        type: oauth:power_bi:embed_url
      schema_version: 1
  sentry_dsn:
    type: secret
    title: Sentry DSN
    optional: true
    is_global: true
    help_text:
      properties:
        advanced: true
        help_text: Sentry DSN for reporting embed and token errors. Leave empty to disable.
        type: string
      schema_version: 1
