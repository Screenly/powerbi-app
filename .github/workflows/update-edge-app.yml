---
name: Update Edge App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

run-name: Updating Powerbi App in ${{ (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) && 'production' || 'stage' }}

jobs:
  update:
    uses: Screenly/edge-apps-actions/.github/workflows/update.yml@v26.10.2
    # This app's old workflow never deleted settings missing from the manifest;
    # keep it that way rather than take the reusable workflow's default (true).
    with:
      delete_missing_settings: false
    secrets:
      SCREENLY_API_TOKEN: ${{ secrets.SCREENLY_API_TOKEN }}
